services:
  jekyll:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chirpy-blog
    working_dir: /var/jekyll
    command: bash -lc "bundle _2.5.23_ install && bundle _2.5.23_ exec jekyll serve --host 0.0.0.0 --watch --force_polling --drafts"
    ports:
      - "4000:4000"
    volumes:
      - ../:/var/jekyll
      - bundle_cache:/usr/local/bundle

  astro:
    build:
      context: ..
      dockerfile: docker/Dockerfile.astro
    container_name: meiernet-blog-astro
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "4321:4321"
    volumes:
      - ../astro:/app
      - astro_node_modules:/app/node_modules

volumes:
  bundle_cache:
  astro_node_modules:

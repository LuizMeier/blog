name: Markdown Lint

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - '**'
    paths:
      - '**.md'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: docker://davidanson/markdownlint-cli2
        with:
          # "_posts/*.md" (sem **) nunca pegava nada, já que os posts ficam
          # em _posts/en/*.md e _posts/pt-BR/*.md - corrigido junto com a
          # adição do novo local de conteúdo em astro/.
          args: "_posts/**/*.md astro/src/content/posts/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Markdown Lint

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - '**'
    paths:
      - '**.md'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: docker://davidanson/markdownlint-cli2
        with:
          # _posts/**/*.md (Jekyll) removido do lint: esses arquivos vão ser
          # excluídos do repo na Fase 4 (migração completa para astro/), não
          # vale corrigir formatação em conteúdo que já tem vida curta.
          args: "astro/src/content/posts/**/*.md astro/src/content/posts/**/*.mdx"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
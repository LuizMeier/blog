name: Post Review with OpenAI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - '**/_posts/**/*.md'
      - 'astro/src/content/posts/**/*.md'
      - 'astro/src/content/posts/**/*.mdx'

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install openai PyGithub GitPython

      - name: Run review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # secrets.TOKEN_GITHUB (PAT customizado) estava dando 401 Bad
          # Credentials - trocado pelo GITHUB_TOKEN automático do Actions,
          # que sempre existe e já tem "pull-requests: write" (suficiente
          # para comentar no PR) via o bloco `permissions` acima.
          TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/actions/post_review.py
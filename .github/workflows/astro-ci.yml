name: Astro CI

on:
  pull_request:
    paths:
      - "astro/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Check for broken internal links
        # medium.lmeier.net bloqueia requisições automatizadas (403 para
        # crawlers/bots) mesmo sendo um link válido - confirmado manualmente.
        run: npx linkinator dist --recurse --skip "^https://(blog\.lmeier\.net|medium\.lmeier\.net)"

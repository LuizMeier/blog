version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/astro"
    versioning-strategy: increase
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TS 7 quebra o npm ci: @astrojs/check@0.9.x só aceita TS ^5 || ^6
      # (peer dependency). Remover esta regra quando o @astrojs/check
      # suportar TS 7 (conferir com: npm view @astrojs/check peerDependencies;
      # fonte: withastro/astro, packages/language-tools/astro-check).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      gh-actions:
        update-types:
          - "major"
    schedule:
      interval: "weekly"
